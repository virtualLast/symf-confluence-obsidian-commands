name: Quality

on:
    push:
    pull_request:

permissions:
    contents: read

jobs:
    quality:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            - uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.4'
                  coverage: none
                  tools: composer:v2

            - uses: ramsey/composer-install@v3

            - run: composer check
